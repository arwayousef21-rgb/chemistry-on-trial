# Continuous integration for THE EQUILIBRIUM MISSION (M0).
# Runs every check against a LOCAL Cloudflare stack (wrangler dev + local D1) with
# SYNTHETIC data. It uses no secrets, no Cloudflare account and never deploys.
name: CI

on:
  push:
    branches: ['claude/**', 'main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (site and Worker)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests (local API + D1 + approved design)
        run: npx playwright test

      - name: Upload test report (synthetic data only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
